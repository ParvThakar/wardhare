<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Inside the machine — PC Components Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #06080d;
      --bg-center: #18213a;
      --ink: #e9edf5;
      --mute: #8a93a6;
      --panel: #0e121c;
      --panel-grad: linear-gradient(180deg, #0e121c 0%, #080b12 100%);
      --line: #1d2432;
      --line-highlight: rgba(255, 255, 255, 0.08);
      --accent-default: #7fb2ff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Sora', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 300px;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
      background: radial-gradient(900px 600px at 40% 45%, var(--bg-center) 0%, #0a0e18 55%, var(--bg) 100%);
    }

    /* HEADER */
    header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 32px;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(6, 8, 13, 0.4);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 23px;
      font-weight: 300;
      margin: 0;
      letter-spacing: 0.2px;
      color: #f1f5f9;
    }

    h1 b {
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(127, 178, 255, 0.35);
    }

    /* Pill Button */
    .pill-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      background: #141a29;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 22px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .pill-btn:hover {
      border-color: #5b6a8f;
      background: #1c2438;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), 0 0 16px rgba(127, 178, 255, 0.2);
      transform: translateY(-1px);
    }

    .pill-btn:active {
      transform: translateY(0);
    }

    .pill-btn:focus-visible,
    .part:focus-visible {
      outline: 2px solid #7fb2ff;
      outline-offset: 4px;
    }

    /* SVG STAGE */
    .stage {
      position: relative;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    svg#s {
      width: 100%;
      height: auto;
      max-height: calc(100vh - 100px);
      max-width: 860px;
      display: block;
      overflow: visible;
    }

    /* PART STYLING & ANIMATIONS */
    .part {
      cursor: pointer;
      outline: none;
      /* Only animate transform, opacity, and filter as specified */
      transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
                  opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  filter 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: translate(var(--ex), var(--ey));
      transform-box: fill-box;
    }

    /* Assembled layout: parts slide into their real motherboard positions */
    .asm .part {
      transform: translate(var(--ax), var(--ay));
    }

    .part .lift {
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Hover and Selected: Part lifts 10px, gets glow in accent color and deep drop shadow */
    .part:hover .lift,
    .part.sel .lift {
      transform: translateY(-10px);
    }

    .part:hover,
    .part.sel {
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 16px var(--c, #7fb2ff));
      z-index: 5;
    }

    /* All other parts fade to 35% when hovering */
    svg.hov .part:not(:hover):not(.sel) {
      opacity: 0.35;
    }

    /* Idle Fan rotation: continuous slow 6s spin */
    .fan {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 6s linear infinite;
    }

    /* Hover speeds fan up from 6s to 1.2s */
    .part:hover .fan,
    .part.sel .fan {
      animation-duration: 1.2s;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .shadow {
      fill: #000000;
      opacity: 0.45;
      filter: blur(8px);
    }

    /* Name tag that appears under component on hover / selection */
    .tag {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      fill: var(--mute);
      text-anchor: middle;
      pointer-events: none;
      opacity: 0;
      letter-spacing: 0.4px;
      transition: opacity 0.3s ease, fill 0.3s ease;
    }

    .part:hover .tag,
    .part.sel .tag {
      opacity: 1;
      fill: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    /* DETAIL PANEL */
    aside {
      background: var(--panel-grad);
      border-left: 1px solid var(--line);
      padding: 32px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      max-height: calc(100vh - 80px);
    }

    .dot {
      width: 38px;
      height: 4px;
      border-radius: 2px;
      background: var(--c, #555555);
      box-shadow: 0 0 14px var(--c, #555555);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    aside h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
    }

    aside .role {
      color: var(--mute);
      font-size: 13.5px;
      line-height: 1.6;
      margin: 0;
    }

    dl {
      margin: 8px 0 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 14px;
      font-size: 12.5px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 14px;
    }

    dt {
      color: var(--mute);
      font-weight: 500;
    }

    dd {
      margin: 0;
      text-align: right;
      color: #e2e8f0;
      font-weight: 600;
      word-break: break-word;
    }

    .fact {
      font-size: 12.5px;
      line-height: 1.65;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      color: #c3cadb;
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.02);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .fact b {
      color: #ffffff;
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* RESPONSIVE STACK UNDER 820px */
    @media (max-width: 820px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr;
      }
      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
        max-height: none;
      }
      header {
        padding: 16px 20px;
      }
      .stage {
        padding: 16px 8px;
      }
    }

    /* PREFERS-REDUCED-MOTION */
    @media (prefers-reduced-motion: reduce) {
      .part,
      .part .lift,
      .pill-btn {
        transition: none !important;
      }
      .fan {
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Inside the <b>machine</b></h1>
    <button id="tog" class="pill-btn" aria-pressed="false" type="button">Assemble the build</button>
  </header>

  <main class="stage">
    <svg id="s" viewBox="0 0 860 640" role="group" aria-label="Exploded PC build components explorer">
      <defs>
        <!-- Gradients -->
        <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#142c30" />
          <stop offset="50%" stop-color="#0a191c" />
          <stop offset="100%" stop-color="#050e10" />
        </linearGradient>

        <linearGradient id="alu" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="35%" stop-color="#cbd5e1" />
          <stop offset="70%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#64748b" />
        </linearGradient>

        <linearGradient id="aluminum" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="35%" stop-color="#cbd5e1" />
          <stop offset="70%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#64748b" />
        </linearGradient>

        <linearGradient id="blk" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2d3545" />
          <stop offset="30%" stop-color="#1b202c" />
          <stop offset="100%" stop-color="#0c0e14" />
        </linearGradient>

        <linearGradient id="black" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2d3545" />
          <stop offset="30%" stop-color="#1b202c" />
          <stop offset="100%" stop-color="#0c0e14" />
        </linearGradient>

        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffea9f" />
          <stop offset="35%" stop-color="#f59e0b" />
          <stop offset="75%" stop-color="#d97706" />
          <stop offset="100%" stop-color="#92400e" />
        </linearGradient>

        <linearGradient id="cu" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fba872" />
          <stop offset="40%" stop-color="#ea580c" />
          <stop offset="80%" stop-color="#c2410c" />
          <stop offset="100%" stop-color="#7c2d12" />
        </linearGradient>

        <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fba872" />
          <stop offset="40%" stop-color="#ea580c" />
          <stop offset="80%" stop-color="#c2410c" />
          <stop offset="100%" stop-color="#7c2d12" />
        </linearGradient>

        <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ff3377" />
          <stop offset="30%" stop-color="#d946ef" />
          <stop offset="60%" stop-color="#8b5cf6" />
          <stop offset="85%" stop-color="#06b6d4" />
          <stop offset="100%" stop-color="#2ee6d6" />
        </linearGradient>

        <linearGradient id="dark-plate" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1f2937" />
          <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>

        <!-- Aerodynamic 9-Blade Fan Unit -->
        <g id="blade">
          <path d="M 0,-4 C 5,-7 14,-13 11,-24 C 4,-20 -2,-12 0,-4 Z" fill="#0d1118" stroke="#334155" stroke-width="0.6" />
        </g>

        <g id="fan-unit">
          <!-- Outer recessed shroud well & metallic ring -->
          <circle r="26" fill="#070a0f" stroke="#1f2937" stroke-width="1.8" />
          <circle r="25" fill="none" stroke="#384252" stroke-width="0.8" />
          <circle r="23" fill="none" stroke="#000000" stroke-width="1" opacity="0.6" />
          
          <!-- Continuous rotating 9-blade fan assembly -->
          <g class="fan">
            <use href="#blade" />
            <use href="#blade" transform="rotate(40)" />
            <use href="#blade" transform="rotate(80)" />
            <use href="#blade" transform="rotate(120)" />
            <use href="#blade" transform="rotate(160)" />
            <use href="#blade" transform="rotate(200)" />
            <use href="#blade" transform="rotate(240)" />
            <use href="#blade" transform="rotate(280)" />
            <use href="#blade" transform="rotate(320)" />
          </g>

          <!-- Central spun-metal aluminum hub -->
          <circle r="9" fill="url(#alu)" stroke="#475569" stroke-width="0.8" />
          <circle r="6.5" fill="#111827" opacity="0.4" />
          <circle r="3.5" fill="#090d14" />
          <path d="M -5,-5 A 7 7 0 0 1 5,-5" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.75" />
        </g>
      </defs>

      <!-- =========================================================================
           1. MOTHERBOARD
           ========================================================================= -->
      <g class="part" id="mobo" tabindex="0" role="button" aria-label="Motherboard" style="--c:#2ee6b6; --ex:130px; --ey:140px; --ax:130px; --ax:130px; --ay:140px;">
        <g class="lift">
          <ellipse class="shadow" cx="160" cy="405" rx="160" ry="12" />

          <!-- Main PCB Layer -->
          <rect width="320" height="390" rx="8" fill="url(#pcb)" stroke="#1a3f47" stroke-width="1.5" />
          <rect x="4" y="4" width="312" height="382" rx="6" fill="none" stroke="#0c2328" stroke-width="1" />

          <!-- Ground Standoff Mounting Holes (Brass washers + center dark hole) -->
          <g fill="none" stroke="url(#gold)" stroke-width="1.4">
            <circle cx="16" cy="16" r="4.5" /><circle cx="16" cy="16" r="2" fill="#040608" stroke="none" />
            <circle cx="16" cy="195" r="4.5" /><circle cx="16" cy="195" r="2" fill="#040608" stroke="none" />
            <circle cx="16" cy="374" r="4.5" /><circle cx="16" cy="374" r="2" fill="#040608" stroke="none" />
            <circle cx="160" cy="16" r="4.5" /><circle cx="160" cy="16" r="2" fill="#040608" stroke="none" />
            <circle cx="160" cy="374" r="4.5" /><circle cx="160" cy="374" r="2" fill="#040608" stroke="none" />
            <circle cx="304" cy="16" r="4.5" /><circle cx="304" cy="16" r="2" fill="#040608" stroke="none" />
            <circle cx="304" cy="195" r="4.5" /><circle cx="304" cy="195" r="2" fill="#040608" stroke="none" />
            <circle cx="304" cy="374" r="4.5" /><circle cx="304" cy="374" r="2" fill="#040608" stroke="none" />
          </g>

          <!-- Glowing Circuit Traces Network -->
          <g stroke="#2ee6b6" stroke-width="1" fill="none" opacity="0.55" stroke-linecap="round">
            <!-- CPU to RAM high-speed bus lines -->
            <path d="M 144,72 L 158,72 L 164,72" />
            <path d="M 144,80 L 156,80 L 164,80" />
            <path d="M 144,88 L 154,88 L 164,88" />
            <path d="M 144,96 L 152,96 L 164,96" />
            <path d="M 144,104 L 150,104 L 164,104" />
            <path d="M 144,112 L 148,112 L 164,112" />

            <!-- CPU to PCIe x16 lines -->
            <path d="M 72,132 L 72,154 L 52,174 L 52,184" />
            <path d="M 80,132 L 80,150 L 60,170 L 60,184" />
            <path d="M 88,132 L 88,146 L 68,166 L 68,184" />
            <path d="M 96,132 L 96,142 L 76,162 L 76,184" />

            <!-- Chipset and SATA bus lines -->
            <path d="M 230,220 L 230,176 L 210,156 L 180,156" />
            <path d="M 270,300 L 278,300 L 284,300" />
            <path d="M 270,314 L 278,314 L 284,314" />
            <path d="M 270,328 L 278,328 L 284,328" />

            <!-- Power delivery VRM trace runs -->
            <path d="M 286,88 L 250,88 L 234,72 L 214,72" stroke-width="1.6" stroke="#22d3ee" opacity="0.7" />
            <path d="M 286,96 L 254,96 L 238,80 L 214,80" stroke-width="1.4" stroke="#22d3ee" opacity="0.7" />
          </g>

          <!-- Via Solder Pads -->
          <g fill="#2ee6b6" opacity="0.75">
            <circle cx="158" cy="72" r="1.3" /><circle cx="156" cy="80" r="1.3" />
            <circle cx="154" cy="88" r="1.3" /><circle cx="152" cy="96" r="1.3" />
            <circle cx="52" cy="174" r="1.3" /><circle cx="60" cy="170" r="1.3" />
            <circle cx="68" cy="166" r="1.3" /><circle cx="76" cy="162" r="1.3" />
            <circle cx="230" cy="176" r="1.3" /><circle cx="210" cy="156" r="1.3" />
          </g>

          <!-- Rear I/O Shield (Left Edge) -->
          <g transform="translate(4, 20)">
            <rect width="18" height="150" rx="2" fill="url(#alu)" stroke="#475569" stroke-width="0.8" />
            <!-- Port cutouts: USB, HDMI, LAN, Audio -->
            <rect x="3" y="10" width="12" height="16" rx="1" fill="#090d14" stroke="#334155" stroke-width="0.5" />
            <rect x="5" y="14" width="8" height="3" fill="#0284c7" />
            <rect x="3" y="32" width="12" height="16" rx="1" fill="#090d14" stroke="#334155" stroke-width="0.5" />
            <rect x="5" y="36" width="8" height="3" fill="#0284c7" />
            <rect x="4" y="56" width="10" height="5" rx="2.5" fill="#090d14" stroke="#38bdf8" stroke-width="0.6" />
            <rect x="3" y="68" width="12" height="18" rx="1" fill="#090d14" stroke="#334155" stroke-width="0.5" />
            <circle cx="5" cy="72" r="1" fill="#22c55e" /><circle cx="13" cy="72" r="1" fill="#eab308" />
            <!-- Audio jacks -->
            <circle cx="9" cy="100" r="3.5" fill="#090d14" stroke="url(#gold)" stroke-width="0.8" />
            <circle cx="9" cy="100" r="1.8" fill="#10b981" />
            <circle cx="9" cy="114" r="3.5" fill="#090d14" stroke="url(#gold)" stroke-width="0.8" />
            <circle cx="9" cy="114" r="1.8" fill="#ec4899" />
            <circle cx="9" cy="128" r="3.5" fill="#090d14" stroke="url(#gold)" stroke-width="0.8" />
            <circle cx="9" cy="128" r="1.8" fill="#38bdf8" />
          </g>

          <!-- Top VRM Heatsink with Fine Fin Lines -->
          <g transform="translate(44, 16)">
            <rect width="170" height="30" rx="3" fill="url(#alu)" stroke="#334155" stroke-width="1" />
            <rect x="2" y="2" width="166" height="26" fill="url(#blk)" opacity="0.25" />
            <!-- Vertical Cooling Fins with Highlight & Shadow pairs -->
            <g stroke="#1a2332" stroke-width="1.2">
              <line x1="14" y1="3" x2="14" y2="27" /><line x1="26" y1="3" x2="26" y2="27" />
              <line x1="38" y1="3" x2="38" y2="27" /><line x1="50" y1="3" x2="50" y2="27" />
              <line x1="62" y1="3" x2="62" y2="27" /><line x1="74" y1="3" x2="74" y2="27" />
              <line x1="86" y1="3" x2="86" y2="27" /><line x1="98" y1="3" x2="98" y2="27" />
              <line x1="110" y1="3" x2="110" y2="27" /><line x1="122" y1="3" x2="122" y2="27" />
              <line x1="134" y1="3" x2="134" y2="27" /><line x1="146" y1="3" x2="146" y2="27" />
              <line x1="158" y1="3" x2="158" y2="27" />
            </g>
            <g stroke="#ffffff" stroke-width="0.8" opacity="0.65">
              <line x1="15.2" y1="3" x2="15.2" y2="27" /><line x1="27.2" y1="3" x2="27.2" y2="27" />
              <line x1="39.2" y1="3" x2="39.2" y2="27" /><line x1="51.2" y1="3" x2="51.2" y2="27" />
              <line x1="63.2" y1="3" x2="63.2" y2="27" /><line x1="75.2" y1="3" x2="75.2" y2="27" />
              <line x1="87.2" y1="3" x2="87.2" y2="27" /><line x1="99.2" y1="3" x2="99.2" y2="27" />
              <line x1="111.2" y1="3" x2="111.2" y2="27" /><line x1="123.2" y1="3" x2="123.2" y2="27" />
              <line x1="135.2" y1="3" x2="135.2" y2="27" /><line x1="147.2" y1="3" x2="147.2" y2="27" />
              <line x1="159.2" y1="3" x2="159.2" y2="27" />
            </g>
          </g>

          <!-- Left VRM Heatsink with Horizontal Fin Lines -->
          <g transform="translate(28, 52)">
            <rect width="30" height="96" rx="3" fill="url(#alu)" stroke="#334155" stroke-width="1" />
            <rect x="2" y="2" width="26" height="92" fill="url(#blk)" opacity="0.25" />
            <g stroke="#1a2332" stroke-width="1.2">
              <line x1="3" y1="12" x2="27" y2="12" /><line x1="3" y1="24" x2="27" y2="24" />
              <line x1="3" y1="36" x2="27" y2="36" /><line x1="3" y1="48" x2="27" y2="48" />
              <line x1="3" y1="60" x2="27" y2="60" /><line x1="3" y1="72" x2="27" y2="72" />
              <line x1="3" y1="84" x2="27" y2="84" />
            </g>
            <g stroke="#ffffff" stroke-width="0.8" opacity="0.65">
              <line x1="3" y1="13.2" x2="27" y2="13.2" /><line x1="3" y1="25.2" x2="27" y2="25.2" />
              <line x1="3" y1="37.2" x2="27" y2="37.2" /><line x1="3" y1="49.2" x2="27" y2="49.2" />
              <line x1="3" y1="61.2" x2="27" y2="61.2" /><line x1="3" y1="73.2" x2="27" y2="73.2" />
              <line x1="3" y1="85.2" x2="27" y2="85.2" />
            </g>
          </g>

          <!-- CPU Socket (LGA Socket with Gold Border, Corner Dots & Retention Bracket) -->
          <g transform="translate(64, 52)">
            <!-- Outer gold socket perimeter with retention arm -->

          <circle cx="130" cy="14" r="4" fill="#06080d" />

          <!-- Gold Contacts at Left Edge -->
          <g fill="url(#gold)">
            <rect x="0" y="3" width="5" height="4" /><rect x="0" y="9" width="5" height="4" />
            <rect x="0" y="15" width="5" height="4" /><rect x="0" y="21" width="5" height="4" />
          </g>
          <!-- M-Key Notch -->
          <rect x="0" y="13" width="7" height="2.5" fill="#0f291e" />

          <!-- Silver Brushed Heatsink Label -->
          <rect x="22" y="3" width="102" height="22" rx="2" fill="url(#alu)" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.4" />
          
          <!-- Label Details -->
          <rect x="28" y="6" width="3" height="16" fill="#10b981" />
          <text x="36" y="13" font-size="6.5" font-weight="700" fill="#0f172a" font-family="'Sora', sans-serif">NVMe PCIe 4.0</text>
          <text x="36" y="20" font-size="5" font-weight="500" fill="#475569" font-family="'Sora', sans-serif">7,000 MB/s • 2TB M.2</text>
          
          <!-- Status LED & NAND chip outlines -->
          <circle cx="116" cy="14" r="1.8" fill="#10b981" />

          <text class="tag" x="65" y="48">NVMe SSD</text>
        </g>
      </g>

      <!-- =========================================================================
           7. SATA SSD
           ========================================================================= -->
      <g class="part" id="sata" tabindex="0" role="button" aria-label="SATA SSD" style="--c:#ff5c93; --ex:600px; --ey:240px; --ax:480px; --ay:320px;">
        <g class="lift">
          <ellipse class="shadow" cx="55" cy="80" rx="55" ry="6" />

          <!-- Brushed-Silver 2.5" Case with Stamped Bevel -->
          <rect width="110" height="74" rx="6" fill="url(#alu)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" />
          
          <!-- Corner Screw Countersinks -->
          <circle cx="6" cy="6" r="2" fill="#475569" /><circle cx="104" cy="6" r="2" fill="#475569" />
          <circle cx="6" cy="68" r="2" fill="#475569" /><circle cx="104" cy="68" r="2" fill="#475569" />

          <!-- Dark Central Drive Label -->
          <rect x="10" y="16" width="90" height="42" rx="3" fill="#121722" stroke="#283244" stroke-width="0.8" />
          
          <!-- Pink Accent Line -->
          <rect x="16" y="26" width="48" height="3.5" rx="1.7" fill="#ff5c93" />
          
          <!-- Label Typography -->
          <text x="16" y="42" font-size="6.5" font-weight="700" fill="#f8fafc" font-family="'Sora', sans-serif" letter-spacing="0.4">SOLID STATE DRIVE</text>
          <text x="16" y="50" font-size="5" font-weight="500" fill="#64748b" font-family="'Sora', sans-serif">SATA 6Gb/s • 2TB</text>

          <!-- Gold Connector Pins Protruding on Bottom Edge -->
          <g fill="url(#gold)">
            <!-- 7-Pin SATA Data -->
            <rect x="62" y="74" width="14" height="6" />
            <!-- 15-Pin SATA Power -->
            <rect x="80" y="74" width="22" height="6" />
          </g>

          <text class="tag" x="55" y="104">SATA SSD</text>
        </g>
      </g>
    </svg>
  </main>

  <aside id="ai">
    <div class="dot"></div>
    <h2 id="t">Pick a part</h2>
    <p class="role" id="r">Hover to lift a component, click to inspect architecture. Assemble the build to see where everything lives.</p>
    <dl id="d"></dl>
    <div class="fact" id="f" hidden></div>
  </aside>

  <script>
    // Single data object holding all component specifications, roles, facts and colors
    const DATA = {
      mobo: {
        name: "Motherboard",
        description: "The city map and central nervous system every part plugs into. It delivers regulated power and routes high-speed data buses between CPU, memory, storage, and graphics.",
        specs: {
          "Socket": "LGA 1700 / AM5",
          "Form Factor": "ATX (305 × 244 mm)",
          "Memory": "4× DDR5 Dual-Channel",
          "Expansion": "PCIe 5.0 x16 Steel Armor",
          "Storage": "4× M.2 NVMe (PCIe 4.0/5.0)",
          "VRM Delivery": "16+1+1 Twin Power Stages"
        },
        fact: "Modern motherboards pack between 8 and 12 copper layers inside their PCB to shield ultra-fast PCIe 5.0 signals from electromagnetic interference.",
        color: "#2ee6b6"
      },
      cpu: {
        name: "Central Processing Unit (CPU)",
        description: "The brain of the machine. It executes instructions, handles thread scheduling, and crunches billions of complex operations every second.",
        specs: {
          "Cores / Threads": "16 Cores (8P + 8E) / 24 Threads",
          "Base Clock": "3.4 GHz",
          "Boost Clock": "Up to 5.7 GHz Max Turbo",
          "L3 Smart Cache": "36 MB Shared",
          "TDP / Max Power": "125W Base / 253W Turbo",
          "Process Node": "Intel 7 (10nm SuperFin)"
        },
        fact: "The silicon die inside is smaller than a postage stamp, yet contains more than 14 billion microscopic transistors running at nanosecond speeds.",
        color: "#6fc3ff"
      },
      ram: {
        name: "Memory (RAM)",
        description: "High-speed volatile workspace. Active applications, game data, and OS processes live here for near-instant random access by the processor.",
        specs: {
          "Type": "DDR5 SDRAM",
          "Capacity": "32 GB Kit (2 × 16 GB)",
          "Data Rate": "6000 MT/s (PC5-48000)",
          "Tested Timings": "CL30-36-36-76",
          "Operating Voltage": "1.35V (Intel XMP / EXPO)",
          "Features": "On-Die ECC, PMIC Onboard"
        },
        fact: "Unlike persistent storage, RAM loses all data the millisecond electricity shuts off. That is why unsaved files disappear during a sudden power outage.",
        color: "#b26bff"
      },
      gpu: {
        name: "Graphics Card (GPU)",
        description: "A massively parallel graphics powerhouse dedicated to rendering 3D geometries, ray tracing lighting effects, and accelerating AI neural computations.",
        specs: {
          "Video Memory": "16 GB GDDR6X",
          "Memory Bus": "256-bit (716.8 GB/s)",
          "Compute Cores": "9,728 CUDA Cores",
          "Bus Interface": "PCIe 4.0 x16",
          "Cooling": "Triple 95mm Axial Fans",
          "Power Draw": "285W TGP"
        },
        fact: "Modern triple-fan graphics cards operate in zero-RPM silent mode, completely halting their fans until GPU temperatures reach 55°C.",
        color: "#ff8a3d"
      },
      psu: {
        name: "Power Supply (PSU)",
        description: "The heart of the build. It converts high-voltage alternating current (AC) from the wall into safe, rock-solid +12V, +5V, and +3.3V direct current (DC) rails.",
        specs: {
          "Rated Output": "850 Watts Continuous",
          "Efficiency": "80 PLUS Gold (≥90% efficiency)",
          "Cabling": "Fully Modular Black Ribbons",
          "Standard": "ATX 3.0 / PCIe 5.0 12VHPWR",
          "Cooling Fan": "135mm FDB Hydro-Bearing",
          "Protections": "OVP, UVP, OCP, OTP, SCP, OPP"
        },
        fact: "A failing or low-tier power supply causes subtle system crashes and random restarts under heavy load long before it permanently stops working.",
        color: "#ffd24a"
      },
      nvme: {
        name: "NVMe M.2 SSD",
        description: "Hyper-fast solid state storage that plugs directly into motherboard M.2 slots, talking directly to the CPU over high-speed PCIe lanes.",
        specs: {
          "Form Factor": "M.2 2280 (80 × 22 mm)",
          "Interface": "PCIe Gen 4.0 ×4, NVMe 2.0",
          "Sequential Read": "Up to 7,000 MB/s",
          "Sequential Write": "Up to 6,500 MB/s",
          "NAND Technology": "176-Layer 3D TLC",
          "Endurance": "1,200 TBW (Terabytes Written)"
        },
        fact: "NVMe drives are over 12 times faster than conventional SATA SSDs and require zero data or power cables, keeping chassis airflow clear.",
        color: "#3dffa8"
      },
      sata: {
        name: "2.5\" SATA SSD",
        description: "Durable secondary storage housed in a classic 2.5-inch aluminum shell. Perfect for holding expansive game libraries, archives, and bulk files.",
        specs: {
          "Form Factor": "2.5-Inch (7mm Thickness)",
          "Interface": "SATA III 6.0 Gb/s",
          "Sequential Read": "560 MB/s (Bus Max)",
          "Sequential Write": "530 MB/s",
          "Cables": "SATA Data + 15-Pin Power",
          "Drive Mount": "2.5\" Caddy or Bay"
        },
        fact: "Because solid state drives have zero mechanical platters or moving heads, they can survive severe drops and shocks of up to 1,500 Gs unharmed.",
        color: "#ff5c93"
      }
    };

    const s = document.getElementById('s');
    const $ = id => document.getElementById(id);
    let selectedPartId = null;

    function openPart(id) {
      const data = DATA[id];
      if (!data) return;

      selectedPartId = id;

      // Update part selection classes
      document.querySelectorAll('.part').forEach(p => {
        p.classList.toggle('sel', p.id === id);
      });

      // Update detail panel
      $('t').textContent = data.name;
      $('r').textContent = data.description;
      $('ai').style.setProperty('--c', data.color);

      // Render specs
      $('d').innerHTML = Object.entries(data.specs)
        .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`)
        .join('');

      // Render fun fact
      const factEl = $('f');
      factEl.hidden = false;
      factEl.innerHTML = `<b>Hardware Fact</b>${data.fact}`;
    }

    function clearSelection() {
      selectedPartId = null;
      document.querySelectorAll('.part').forEach(p => p.classList.remove('sel'));
      $('t').textContent = 'Pick a part';
      $('r').textContent = 'Hover to lift a component, click to inspect architecture. Assemble the build to see where everything lives.';
      $('d').innerHTML = '';
      $('f').hidden = true;
      $('ai').style.removeProperty('--c');
    }

    // Attach interaction listeners to each part
    document.querySelectorAll('.part').forEach(p => {
      // Click selection
      p.addEventListener('click', () => openPart(p.id));

      // Keyboard accessibility (Enter / Space)
      p.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openPart(p.id);
        }
      });

      // Hover dimming
      p.addEventListener('mouseenter', () => s.classList.add('hov'));
      p.addEventListener('mouseleave', () => s.classList.remove('hov'));
    });

    // Toggle Assemble / Explode Button
    $('tog').addEventListener('click', e => {
      const isAssembled = s.classList.toggle('asm');
      e.currentTarget.textContent = isAssembled ? 'Pull it apart' : 'Assemble the build';
      e.currentTarget.setAttribute('aria-pressed', isAssembled ? 'true' : 'false');
    });

    // Keyboard Esc clears selection
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        clearSelection();
      }
    });
  </script>
</body>
</html>
